<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b8afa7"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#14110f"/>
<text x="32" y="44" fill="#f4efe9" font-size="22" font-weight="700">How Cesta works</text>
<g><rect x="40" y="230" width="330" height="130" rx="14" fill="#211c19" stroke="#3BC9DB" stroke-width="1.5"/>
<text x="205.0" y="279.0" text-anchor="middle" fill="#f4efe9" font-size="15" font-weight="650">Cesta PWA</text>
<text x="205.0" y="299.0" text-anchor="middle" fill="#b8afa7" font-size="12">IndexedDB · records {k, u, v}</text>
<text x="205.0" y="316.0" text-anchor="middle" fill="#b8afa7" font-size="12">works fully offline</text>
<text x="205.0" y="333.0" text-anchor="middle" fill="#b8afa7" font-size="12">.xlsx in/out · receipt reader</text>
</g>
<g><rect x="470" y="250" width="280" height="90" rx="14" fill="#211c19" stroke="#3BC9DB" stroke-width="1.5"/>
<text x="610.0" y="291.0" text-anchor="middle" fill="#f4efe9" font-size="15" font-weight="650">Cloudflare Worker</text>
<text x="610.0" y="311.0" text-anchor="middle" fill="#b8afa7" font-size="12">/api router (optional sync)</text>
</g>
<g><rect x="470" y="430" width="280" height="90" rx="14" fill="#211c19" stroke="#3a322d" stroke-width="1.5"/>
<text x="610.0" y="471.0" text-anchor="middle" fill="#f4efe9" font-size="15" font-weight="650">Durable Object &#x27;Dados&#x27;</text>
<text x="610.0" y="491.0" text-anchor="middle" fill="#b8afa7" font-size="12">SQLite · one per family</text>
</g>
<g><rect x="860" y="250" width="300" height="90" rx="14" fill="#211c19" stroke="#3a322d" stroke-width="1.5"/>
<text x="1010.0" y="291.0" text-anchor="middle" fill="#f4efe9" font-size="15" font-weight="650">Mesa (nutrition)</text>
<text x="1010.0" y="311.0" text-anchor="middle" fill="#b8afa7" font-size="12">diet list → packages → prices</text>
</g>
<g><rect x="470" y="90" width="280" height="80" rx="14" fill="#211c19" stroke="#3a322d" stroke-width="1.5"/>
<text x="610.0" y="126.0" text-anchor="middle" fill="#f4efe9" font-size="15" font-weight="650">Claude (copy &amp; paste)</text>
<text x="610.0" y="146.0" text-anchor="middle" fill="#b8afa7" font-size="12">receipt without QR · tips</text>
</g>
